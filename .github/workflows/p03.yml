name: Mictlán Applications Alpha
"on":
  pull_request:
    branches: [desarrollo/mictlan-alpha, verificacion/p03-3-ci, verificacion/p02f-ci, verificacion/p02g-memoria-alpha, consolidacion/alpha-0.1-sdk, aplicaciones/p1-ui, aplicaciones/p1-distribucion]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contrato:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        revision: [p11]
        profile: [debug, release, sanitizers]
    steps:
      - name: SDK exacto de la propuesta
        id: sdk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Resolver contrato fijado
        id: contract
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          lock = json.load(open('sdk/ci/p03/contrato.json'))
          values = {'core_sha': lock['core_revisions'][os.environ['REVISION']]['sha'],
                    'raylib_sha': lock['raylib_sha'],
                    'prior_sha': lock['core_revisions'][lock['core_revisions'][os.environ['REVISION']]['stress']['abi_previa']]['sha'],
                    'baseline_sha': lock['core_revisions'][lock['core_revisions'][os.environ['REVISION']]['stress']['base']]['sha']}
          for key, value in values.items():
              assert re.fullmatch(r'[0-9a-f]{40}', value)
              print(key + '=' + value)
          PY
      - name: Core exacto, sin cambios ni fusiones
        id: core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TuxMatic99/Mictlan-Core
          ref: ${{ steps.contract.outputs.core_sha }}
          path: core
          persist-credentials: false
          token: ${{ secrets.MICTLAN_CORE_READ_TOKEN || github.token }}
      - name: Core F+E para comparación de memoria
        id: core_fe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TuxMatic99/Mictlan-Core
          ref: ${{ steps.contract.outputs.baseline_sha }}
          path: core-fe
          persist-credentials: false
          token: ${{ secrets.MICTLAN_CORE_READ_TOKEN || github.token }}
      - name: Raylib 5.5 fijado
        id: raylib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: raysan5/raylib
          ref: ${{ steps.contract.outputs.raylib_sha }}
          path: raylib
          persist-credentials: false
      - name: Resolver revisión de VectorLab
        id: lab_sha
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          sha = json.load(open('sdk/ci/p1/revisiones.json'))['lab']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          print('sha=' + sha)
          PY
      - name: Lab exacto
        id: lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TuxMatic99/Mictlan-Lab
          ref: ${{ steps.lab_sha.outputs.sha }}
          path: lab
          persist-credentials: false
      - name: Core Alpha para comprobar la ABI anterior
        id: core_g
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TuxMatic99/Mictlan-Core
          ref: ${{ steps.contract.outputs.prior_sha }}
          path: core-g
          persist-credentials: false
          token: ${{ secrets.MICTLAN_CORE_READ_TOKEN || github.token }}
      - name: Dependencias
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake python3 binutils pkg-config libreadline-dev xorg-dev libgl1-mesa-dev unzip shared-mime-info libglib2.0-bin
      - name: Compilar y ejecutar sin depurador ni trazador
        id: verify
        env:
          PROFILE: ${{ matrix.profile }}
          REVISION: ${{ matrix.revision }}
          SDK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash sdk/scripts/p03/preparar_ci.sh "$PROFILE" "$GITHUB_WORKSPACE/core" \
            "$GITHUB_WORKSPACE/raylib" "$RUNNER_TEMP/p03-$REVISION-$PROFILE" "$SDK_SHA" "$REVISION"
      - name: Extraer y comprobar la distribución Alpha
        id: alpha
        if: ${{ matrix.profile == 'release' }}
        env:
          WORK: ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -o pipefail
          bash sdk/scripts/p04/preparar_alpha.sh "$GITHUB_WORKSPACE/core" "$WORK/core" "$WORK/alpha" "$REVISION" 2>&1 | tee "$WORK/alpha.log"
      - name: Dependencias de pruebas de ventana
        id: deps_x11
        if: ${{ matrix.profile != 'debug' }}
        run: sudo apt-get install --yes xvfb xauth openbox xdotool wmctrl libgl1-mesa-dri imagemagick debuginfod
      - name: Abrir la ventana de ejemplo y comprobar eventos y cierre
        id: ventana
        if: ${{ !cancelled() && matrix.profile == 'release' && steps.verify.outcome == 'success' }}
        env:
          WORK: ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a --server-args='-screen 0 1280x800x24' bash -e -c '
              openbox > "$1/openbox.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for i in {1..30}; do wmctrl -m >/dev/null 2>&1 && break; sleep 0.2; done
              bash sdk/tests/alpha/ventana.sh "$1/sdk/host_ui" "$1/ventana"
          ' bash "$WORK"
      - name: VectorLab, distribución y pruebas P1
        id: p1
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && (matrix.profile == 'debug' || steps.deps_x11.outcome == 'success') }}
        env:
          PROFILE: ${{ matrix.profile }}
          WORK: ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}
          DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
        run: |
          set -o pipefail
          bash sdk/scripts/p1/verificar.sh "$PROFILE" "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/lab" \
            "$GITHUB_WORKSPACE/raylib" "$WORK" 2>&1 | tee "$WORK/p1.log"
      - name: Conservar tambien fallos de preparacion
        if: ${{ always() }}
        env:
          STEPS: ${{ toJSON(steps) }}
          PROFILE: ${{ matrix.profile }}
          REVISION: ${{ matrix.revision }}
          SDK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('p03-' + os.environ['REVISION'] + '-' + os.environ['PROFILE'])
          work.mkdir(parents=True, exist_ok=True)
          steps = json.loads(os.environ['STEPS'])
          path = work / 'evidence/report.json'
          if path.exists():
              status = json.loads(path.read_text())['status']
              if status == 'PASS' and os.environ['PROFILE'] == 'release':
                  result = work / 'alpha/alpha.json'
                  if steps.get('alpha', {}).get('outcome') != 'success' or not result.is_file():
                      status = 'FAIL_ALPHA'
                  elif steps.get('ventana', {}).get('outcome') != 'success':
                      gui = work / 'ventana/ventana.json'
                      status = json.loads(gui.read_text())['status'] if gui.is_file() else 'BLOCKED_INFRASTRUCTURE'
          elif steps.get('contract', {}).get('outcome') == 'failure': status = 'FAIL_CONFIGURATION'
          elif any(steps.get(k, {}).get('outcome') != 'success' for k in ['sdk', 'core', 'core_fe', 'core_g', 'raylib', 'lab', 'deps']): status = 'BLOCKED_INFRASTRUCTURE'
          else: status = 'FAIL_PREPARATION'
          p1 = work / 'p1/p1.json'
          p1_status = json.loads(p1.read_text())['status'] if p1.is_file() else 'FAIL_NOT_RUN'
          if steps.get('deps_x11', {}).get('outcome') == 'failure':
              p1_status = 'BLOCKED_INFRASTRUCTURE'
          if status == 'PASS' and p1_status != 'PASS':
              status = p1_status
          record = {'status': status, 'p1': p1_status, 'sdk_sha': os.environ['SDK_SHA'], 'steps': steps}
          (work / 'workflow.json').write_text(json.dumps(record, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Core ' + os.environ['REVISION'] + ', ' + os.environ['PROFILE'] + ': **' + status + '**\n')
              f.write('Aplicaciones P1: **' + p1_status + '**\n')
              if os.environ['PROFILE'] == 'release':
                  path = work / 'ventana/ventana.json'
                  gui = json.loads(path.read_text())['status'] if path.is_file() else 'BLOCKED_INFRASTRUCTURE'
                  f.write('Ventana X11 de referencia: **' + gui + '**\n')
                  record['ventana'] = gui
                  (work / 'workflow.json').write_text(json.dumps(record, indent=2))
          if status != 'PASS':
              raise SystemExit(status)
          PY
      - name: Informes, trazas y JUnit incluso al fallar
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-${{ matrix.revision }}-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/preparation.*
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/workflow.json
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/packages.txt
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/evidence/
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/**/CMakeCache.txt
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/**/compile_commands.json
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/**/Testing/Temporary/*.log
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/alpha.log
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/alpha/*.log
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/alpha/*.err
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/alpha/alpha.json
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/alpha/*.zip
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/alpha/*.sha256
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/ventana/
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/openbox.log
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1.log
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/p1.json
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/aplicaciones/
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/memoria/
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/mesa/
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/ventana/
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/ventana-softpipe/
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/paquete/*.zip*
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/paquete/paquete.json
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/paquete.log
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/vscode/vscode.json
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/anterior-build.log
            ${{ runner.temp }}/p03-${{ matrix.revision }}-${{ matrix.profile }}/p1/sdk-p1-build.log
